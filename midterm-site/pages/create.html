<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Character - characafe</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">☕ <span>characafe</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="character.html">Featured OC</a></li>
        <li><a href="roleplay.html">Roleplay</a></li>
        <li><a href="create.html" class="btn-nav active">+ New Character</a></li>
      </ul>
    </div>
  </header>

  <main style="max-width: 820px;">
    <h1 class="page-title" style="margin-bottom: 1.5rem;">Create New Character</h1>

    <form action="dashboard.html" method="get">
      <div class="card" style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.35rem; margin-bottom: 1rem;">Basic Information</h2>

        <div class="form-group">
          <label for="name" class="form-label">Character Name *</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Enter character name" required />
        </div>

        <div class="form-group">
          <label for="folder" class="form-label">Folder</label>
          <select id="folder" name="folder" class="form-select">
            <option value="main">Main Cast</option>
            <option value="fantasy">Fantasy World</option>
            <option value="scifi">Sci-Fi Concepts</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="avatar" class="form-label">Character Avatar Image</label>
          <input type="file" id="avatar" name="avatar" accept="image/*" class="form-input" />
        </div>
      </div>

      <div class="card" style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.35rem; margin-bottom: 1rem;">Character Tags</h2>
        <div class="checkbox-grid">
          <label class="checkbox-item">
            <input type="checkbox" name="ships" checked /> ❤️ Ships OK
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="rp" checked /> 💬 Roleplay Open
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="ufs" /> 💰 Up For Sale (UFS)
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="uft" /> 🔄 Up For Trade (UFT)
          </label>
        </div>
      </div>

      <div class="card" style="margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.35rem; margin-bottom: 1rem;">Content Warnings &amp; Writing</h2>
        <div class="form-group">
          <label for="warnings" class="form-label">Content Warnings</label>
          <textarea id="warnings" name="warnings" rows="2" class="form-textarea" placeholder="Enter warnings separated by commas (e.g., violence, gore)"></textarea>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label for="backstory" class="form-label">Writing Content (Backstory &amp; Personality)</label>
          <textarea id="backstory" name="backstory" rows="6" class="form-textarea" placeholder="Write your character's lore, personality, and story details..."></textarea>
        </div>
      </div>

      <div>
        <button type="submit" class="btn btn-primary">Save Character</button>
        <a href="dashboard.html" class="btn btn-outline" style="margin-left: 0.5rem;">Cancel</a>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <p>characafe &mdash; Your Cozy Character Storage. Built for writers, artists, and roleplayers.</p>
  </footer>

</body>
</html>
